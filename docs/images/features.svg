<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="280" fill="#1e1e2e" rx="12"/>

  <!-- Card 1: Themes -->
  <rect x="24" y="24" width="170" height="110" fill="url(#card1)" rx="8" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="44" y="56" font-family="system-ui" font-size="22">🎨</text>
  <text x="44" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#89b4fa">테마 시스템</text>
  <text x="44" y="100" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">5가지 프리셋</text>
  <text x="44" y="116" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">실시간 적용</text>

  <!-- Card 2: Code -->
  <rect x="210" y="24" width="170" height="110" fill="url(#card2)" rx="8" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="230" y="56" font-family="system-ui" font-size="22">💻</text>
  <text x="230" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#cba6f7">코드 하이라이팅</text>
  <text x="230" y="100" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">Shiki 6가지 테마</text>
  <text x="230" y="116" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">20+ 언어 지원</text>

  <!-- Card 3: Math/Diagram -->
  <rect x="396" y="24" width="170" height="110" fill="url(#card3)" rx="8" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="416" y="56" font-family="system-ui" font-size="22">📐</text>
  <text x="416" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a6e3a1">수식 / 다이어그램</text>
  <text x="416" y="100" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">KaTeX 수식</text>
  <text x="416" y="116" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">Mermaid 차트</text>

  <!-- Card 4: Files -->
  <rect x="582" y="24" width="170" height="110" fill="url(#card4)" rx="8" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="602" y="56" font-family="system-ui" font-size="22">📁</text>
  <text x="602" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f9e2af">파일 관리</text>
  <text x="602" y="100" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">탭 기반 멀티 파일</text>
  <text x="602" y="116" font-family="system-ui, sans-serif" font-size="11" fill="rgba(205,214,244,0.6)">파일 트리 탐색</text>

  <!-- Bottom row -->
  <rect x="24" y="152" width="752" height="2" fill="rgba(99,102,241,0.2)" rx="1"/>

  <text x="400" y="190" font-family="system-ui, sans-serif" font-size="12" fill="rgba(205,214,244,0.5)" text-anchor="middle">Split View  ·  Ctrl+F 검색  ·  자동 목차  ·  이미지 지원  ·  GFM  ·  콜아웃 블럭</text>

  <!-- Tech stack pills -->
  <rect x="150" y="210" width="90" height="24" fill="rgba(59,130,246,0.2)" rx="12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="195" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#89b4fa" text-anchor="middle">Electron</text>

  <rect x="254" y="210" width="70" height="24" fill="rgba(139,92,246,0.2)" rx="12" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="289" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#cba6f7" text-anchor="middle">React</text>

  <rect x="338" y="210" width="100" height="24" fill="rgba(34,197,94,0.2)" rx="12" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="388" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">TypeScript</text>

  <rect x="452" y="210" width="90" height="24" fill="rgba(245,158,11,0.2)" rx="12" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="497" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#f9e2af" text-anchor="middle">Tailwind</text>

  <rect x="556" y="210" width="60" height="24" fill="rgba(249,115,22,0.2)" rx="12" stroke="#f97316" stroke-width="1" stroke-opacity="0.4"/>
  <text x="586" y="226" font-family="system-ui, sans-serif" font-size="11" fill="#fab387" text-anchor="middle">Shiki</text>
</svg>
