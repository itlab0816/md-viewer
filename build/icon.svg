<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1e"/>
      <stop offset="100%" style="stop-color:#2c2c30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 문서 몸체 -->
  <rect x="120" y="88" width="272" height="336" rx="20" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="2"/>

  <!-- 문서 접힌 모서리 -->
  <path d="M336 88 L392 144 L336 144 Z" fill="#1a1a1e"/>
  <path d="M336 88 L392 144 L336 144 Z" fill="none" stroke="#3a3a3c" stroke-width="2"/>

  <!-- # 심볼 (마크다운 대표 기호) -->
  <!-- 가로선 1 -->
  <rect x="168" y="210" width="176" height="16" rx="8" fill="url(#accent)"/>
  <!-- 가로선 2 -->
  <rect x="168" y="250" width="176" height="16" rx="8" fill="url(#accent)" opacity="0.7"/>
  <!-- 세로선 1 -->
  <rect x="210" y="188" width="14" height="60" rx="7" fill="url(#accent)"/>
  <!-- 세로선 2 -->
  <rect x="288" y="188" width="14" height="60" rx="7" fill="url(#accent)"/>

  <!-- 아래 텍스트 라인들 -->
  <rect x="168" y="312" width="120" height="10" rx="5" fill="#4a4a4e"/>
  <rect x="168" y="334" width="176" height="10" rx="5" fill="#3a3a3c"/>
  <rect x="168" y="356" width="88" height="10" rx="5" fill="#3a3a3c"/>
</svg>
